- type: entity
  name: BSO testsword
  parent: [BaseItem, BaseGrandTheftContraband]
  id: BSOTestSword
  description: Lorem Ipsum ligma balls
  components:
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
    size: Ginormous # Use your sheath.
    heldPrefix: off
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
    state: icon
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 50
    autoRechargePauseTime: 40
  - type: DisarmMalus
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Wieldable
  - type: GunRequiresWield
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 60
    animation: WeaponArcThrust
  - type: ItemSwitch
    needsPower: true
    defaultState: off
    state: "off"
    showLabel: true
    states:
      off: !type:ItemSwitchState
        verb: off
        energyPerUse: 0
        sprite:
          sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
          state: icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 12
            woundSeverityMultipliers:
              Slash: 2
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
          angle: 60
          animation: WeaponArcThrust

      stun: !type:ItemSwitchState
        verb: stun
        energyPerUse: 48
        sprite:
          sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
          state: stun-icon
        components:
        - type: Gun
          soundGunshot: /Audio/Effects/radpulse7.ogg
          fireRate: 0.5
          useKey: false
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Shock: 0
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        - type: StaminaDamageOnHit
          damage: 20
          overtime: 15
          lightAttackDamageMultiplier: 2
          lightAttackOvertimeDamageMultiplier: 1
          soundStateActivate:
          collection: sparks
          params:
            variation: 0.250
        - type: RechargeBasicEntityAmmo
          rechargeCooldown: 1.5
          rechargeSound:
          path: /Audio/Magic/Cults/ClockCult/steam_whoosh.ogg
        - type: BasicEntityAmmoProvider
          proto: BulletDisablerSmgSpread
          fireCost: 100
          capacity: 1 # i dont know why but it makes a no ammo click without these
          count: 1 # i dont know why but it makes a no ammo click without these

      ion: !type:ItemSwitchState
        verb: ion
        energyPerUse: 65 # 65 real
        sprite:
          sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
          state: ion-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Ion: 24
              Shock: 3
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      lethal: !type:ItemSwitchState
        verb: lethal
        energyPerUse: 80
        sprite:
          sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
          state: lethal-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 6
              Heat: 12
            woundSeverityMultipliers:
              Slash: 2
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      empowered: !type:ItemSwitchState
        verb: empowered
        energyPerUse: 999
        sprite:
          sprite: _Goobstation/Objects/Weapons/Melee/justice.rsi
          state: empowered-icon
        components:
        - type: Explosive
          explosionType: Default
          totalIntensity: 16
          intensitySlope: 0.5
          maxIntensity: 1.6
          canCreateVacuum: false
          deleteAfterExplosion: false
          repeatable: true
        - type: ExplodeOnMeleeHit
        - type: MeleeWeapon
          canWideSwing: false
          attackRate: 0.5
          animation: WeaponArcThrust
          damage:
            types:
              Slash: 25
              Heat: 25
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250